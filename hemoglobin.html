  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where

    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      return out;

    window.addEventListener('message', function (e) {

      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        }

        // request spray; past the cap (far above any real page count) new

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

            while (true) {
              const { done, value } = await reader.read();

              chunks.push(value);
              totalLen += value.length;

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

          return;
        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);

          const blob = new Blob([finalBytes], { type: entry.mime });

        }

        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });

        resourceBlobs[blobUrls[uuid]] = blob;

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"da\"><head>\n<meta charset=\"utf-8\">\n<title>Hæmoglobin — aminosyrefarver<\u002Ftitle>\n\n\n\n\n\n<script>\n(function(){var R=window.__resources||{};function u(id,p){return R[id]||new URL(p,location.href).href;}\nvar m={imports:{\"three\":u('three','./vendor/three.module.js'),\"three/core\":u('threeCore','./vendor/three.core.js'),\n\"three/addons/controls/OrbitControls.js\":u('orbit','./vendor/OrbitControls.js'),\n\"three/addons/exporters/OBJExporter.js\":u('objExp','./vendor/OBJExporter.js'),\n\"three/addons/exporters/GLTFExporter.js\":u('gltfExp','./vendor/GLTFExporter.js')}};\nvar s=document.createElement('script');s.type='importmap';s.textContent=JSON.stringify(m);document.currentScript.after(s);})();\n<\u002Fscript>\n<style>\n  html,body{margin:0;height:100%;background:#f3f0ea;font-family:\"Helvetica Neue\",Helvetica,Arial,sans-serif;color:#24211d}\n  a{color:#24211d} a:hover{color:#8a4a3a}\n  three-d-stage:not(:defined){visibility:hidden}\n  .legend{position:fixed;top:20px;left:24px;z-index:5;pointer-events:none;display:flex;flex-direction:column;gap:10px}\n  .legend h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-0.01em}\n  .legend p{margin:0;font-size:13px;color:#5a544c;max-width:300px;text-wrap:pretty;line-height:1.4}\n  .keys{display:flex;flex-direction:column;gap:6px;font-size:12px;color:#3a352f}\n  .key{display:flex;align-items:center;gap:8px}\n  .sw{width:10px;height:10px;border-radius:50%}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"legend\">\n  <h1>Hæmoglobin<\u002Fh1>\n  <p style=\"font-size:12px;font-weight:600;color:#0a6fc0\">Drag to orbit · scroll to zoom · right-drag to pan<\u002Fp>\n  <p style=\"margin-top:14px\">Hæmoglobin, kroppens ilttransportør<\u002Fp>\n  <p style=\"margin-top:14px\">Oxygeneret α₂β₂-tetramer (PDB 1HHO). Globinkæderne er farvet efter aminosyretype langs α-sekvensen (141 aminosyrer) og β-sekvensen (146 aminosyrer).<\u002Fp>\n  <div class=\"keys\">\n    <div class=\"key\"><span class=\"sw\" style=\"background:#0a9bf0\"><\u002Fspan>N-terminal<\u002Fdiv>\n    <div class=\"key\"><span class=\"sw\" style=\"background:#111111\"><\u002Fspan>C-terminal<\u002Fdiv>\n    <div class=\"key\"><span class=\"sw\" style=\"background:#5a5d62\"><\u002Fspan>Hæm-porphyrin<\u002Fdiv>\n    <div class=\"key\"><span class=\"sw\" style=\"background:#e09a3a\"><\u002Fspan>Fe²⁺<\u002Fdiv>\n    <div class=\"key\"><span class=\"sw\" style=\"background:#ff0d0d\"><\u002Fspan>O₂ (Fe···O₂ stiplet orange)<\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"font-size:12px\">Aminosyrer: RasMol-farveskemaet “amino”.<br>Fremhævede atomer: CPK-farveskemaet.<\u002Fp>\n  <p style=\"font-size:11px;color:#7a7268;pointer-events:auto\">Kilde:<br>Shaanan, B. (1983). Structure of human oxyhaemoglobin at 2.1 Å resolution. <i>J. Mol. Biol.<\u002Fi> 171, 31–59. Protein Data Bank, PDB-ID <a href=\"https://www.rcsb.org/structure/1HHO\" target=\"_blank\" rel=\"noopener\">1HHO<\u002Fa>, doi:10.2210/pdb1hho/pdb.<\u002Fp>\n<\u002Fdiv>\n<a href=\"https://clbohtx.github.io/HTXLogicLab/hemoglobin.html\" target=\"_blank\" rel=\"noopener\" style=\"position:fixed;left:24px;bottom:20px;z-index:5;display:flex;flex-direction:column;gap:4px;text-decoration:none;color:#5a544c;font-size:11px\">\n  <img src=\"0aee95fe-1feb-4391-ae59-cc5291a93c0b\" alt=\"QR-kode til clbohtx.github.io/HTXLogicLab/hemoglobin.html\" width=\"88\" height=\"88\" style=\"display:block;border:1px solid #d9d2c6\">\n<\u002Fa>\n<three-d-stage name=\"hemoglobin_v8\" autorotate=\"\"><\u002Fthree-d-stage>\n<script src=\"4f072569-bf2e-46f7-9e10-5972ab27f332\"><\u002Fscript>\n<script type=\"module\">\nconst stage = document.querySelector('three-d-stage');\nconst { THREE } = await stage.ready;\nconst V = (x, y, z) => new THREE.Vector3(x, y, z);\nconst S = 0.1; // 1 nm -> 0.1 m (illustrative scale)\n\n// Human Hb sequences (PDB 1HHO, chains A/B)\nconst SEQ = {\n  alpha: 'VLSPADKTNVKAAWGKVGAHAGEYGAEALERMFLSFPTTKTYFPHFDLSHGSAQVKGHGKKVADALTNAVAHVDDMPNALSALSDLHAHKLRVDPVNFKLLSHCLLVTLAAHLPAEFTPAVHASLDKFLASVSTVLTSKYR',\n  beta: 'VHLTPEEKSAVTALWGKVNVDEVGGEALGRLLVVYPWTQRFFESFGDLSTPDAVMGNPKVKAHGKKVLGAFSDGLAHLDNLKGTFATLSELHCDKLHVDPENFRLLGNVLVCVLAHHFGKEFTPPVQAAYQKVVAGVANALAHKYH',\n};\n// Residue ranges (1-based, inclusive) per helix, from the globin fold of 1HHO\nconst RANGES = {\n  alpha: { A:[3,18], B:[20,35], C:[36,42], E:[52,70], F:[80,88], G:[94,112], H:[118,139], his:87 },\n  beta:  { A:[4,19], B:[20,35], C:[36,42], D:[50,56], E:[57,75], F:[85,93], G:[99,117], H:[123,144], his:92 },\n};\n// RasMol \"amino\" colour scheme\nconst AA_GROUPS = [\n  ['Asp_Glu', 'DE', 0xe60a0a], ['Cys_Met', 'CM', 0xe6e600], ['Lys_Arg', 'KR', 0x145aff],\n  ['Ser_Thr', 'ST', 0xfa9600], ['Phe_Tyr', 'FY', 0x3232aa], ['Asn_Gln', 'NQ', 0x00dcdc],\n  ['Gly', 'G', 0xebebeb], ['Leu_Val_Ile', 'LVI', 0x0f820f], ['Ala', 'A', 0xc8c8c8],\n  ['Trp', 'W', 0xb45ab4], ['His', 'H', 0x8282d2], ['Pro', 'P', 0xdc9682],\n];\nconst AA_MATS = AA_GROUPS.map(([n, , c]) => new THREE.MeshStandardMaterial({ name: 'aa_' + n, color: c, roughness: 0.55, metalness: 0.0 }));\nconst AA_IDX = {}; AA_GROUPS.forEach(([, letters], i) => { for (const l of letters) AA_IDX[l] = i; });\nconst resRange = (kind, a, b) => { const s = SEQ[kind]; const out = []; for (let i = a; i <= b; i++) out.push(s[i - 1]); return out; };\n\nconst M = {\n  nterm: new THREE.MeshStandardMaterial({ name: 'N_terminus', color: 0x0a9bf0, roughness: 0.4, metalness: 0.0 }),\n  cterm: new THREE.MeshStandardMaterial({ name: 'C_terminus', color: 0x111111, roughness: 0.4, metalness: 0.0 }),\n  alpha: new THREE.MeshStandardMaterial({ name: 'alpha_globin', color: 0xc4553f, roughness: 0.55, metalness: 0.0 }),\n  beta: new THREE.MeshStandardMaterial({ name: 'beta_globin', color: 0x3f6f8e, roughness: 0.55, metalness: 0.0 }),\n  heme: new THREE.MeshStandardMaterial({ name: 'heme_porphyrin', color: 0x5a5d62, roughness: 0.45, metalness: 0.1 }),\n  iron: new THREE.MeshStandardMaterial({ name: 'iron', color: 0xe09a3a, roughness: 0.3, metalness: 0.35 }),\n  oxygen: new THREE.MeshStandardMaterial({ name: 'oxygen', color: 0xff0d0d, roughness: 0.35, metalness: 0.0 }),\n};\n\n// Globin fold, local nm. Heme pocket opens toward +x.\nconst HELICES = [\n  { id: 'A', c: V(-0.6, 1.3, 0.9), d: V(1, 0, -0.15), n: 16 },\n  { id: 'B', c: V(-0.2, 0.0, 1.3), d: V(-0.6, -0.8, 0), n: 16 },\n  { id: 'C', c: V(-0.7, -1.4, 0.7), d: V(0, 0, -1), n: 7 },\n  { id: 'D', c: V(-0.4, -2.0, 0.2), d: V(0.8, 0.2, 0.4), n: 7, betaOnly: true },\n  { id: 'E', c: V(0.5, -0.1, 0.7), d: V(0.15, 1, -0.1), n: 19 },\n  { id: 'F', c: V(1.0, 0.5, -0.75), d: V(0, -1, 0.1), n: 9 },\n  { id: 'G', c: V(0.0, -0.3, -1.25), d: V(-0.15, 1, 0), n: 19 },\n  { id: 'H', c: V(-1.6, 0.1, -0.2), d: V(0.1, -1, 0.25), n: 22 },\n];\nconst RISE = 0.15, HR = 0.23;\nconst HEME_C = V(0.8, 0.35, 0.0);\n\nfunction helixPoints(h) {\n  const d = h.d.clone().normalize();\n  const L = h.n * RISE;\n  const start = h.c.clone().addScaledVector(d, -L / 2);\n  const u = new THREE.Vector3().crossVectors(d, Math.abs(d.y) < 0.9 ? V(0, 1, 0) : V(1, 0, 0)).normalize();\n  const v = new THREE.Vector3().crossVectors(d, u);\n  const pts = [];\n  for (let t = 0; t <= h.n + 1e-6; t += 0.125) {\n    const th = t * (100 * Math.PI / 180);\n    pts.push(start.clone().addScaledVector(d, t * RISE)\n      .addScaledVector(u, HR * Math.cos(th)).addScaledVector(v, HR * Math.sin(th)));\n  }\n  return { pts, d };\n}\n\nfunction tube(points, radius, segs, mat, name, closed = false, residues = null) {\n  const curve = new THREE.CatmullRomCurve3(points.map(p => p.clone().multiplyScalar(S)), closed, 'centripetal');\n  const geo = new THREE.TubeGeometry(curve, segs, radius, 12, closed);\n  if (residues && residues.length) {\n    const per = 12 * 6; // indices per tubular segment\n    let start = 0, cur = AA_IDX[residues[0]];\n    for (let i = 1; i <= segs; i++) {\n      const r = i < segs ? AA_IDX[residues[Math.min(residues.length - 1, Math.floor(i / segs * residues.length))]] : -1;\n      if (r !== cur) { geo.addGroup(start * per, (i - start) * per, cur); start = i; cur = r; }\n    }\n    mat = AA_MATS;\n  }\n  const m = new THREE.Mesh(geo, mat);\n  m.name = name; m.castShadow = true; m.receiveShadow = true;\n  if (!closed) {\n    const endMat = (i) => residues && residues.length ? AA_MATS[AA_IDX[residues[i]]] : mat;\n    [[0, 0], [1, residues ? residues.length - 1 : 0]].forEach(([t, ri], k) => {\n      const j = new THREE.Mesh(new THREE.SphereGeometry(radius, 16, 12), endMat(ri));\n      j.name = name + (k ? '_joint_end' : '_joint_start'); j.position.copy(curve.getPoint(t)); j.castShadow = true;\n      m.add(j);\n    });\n  }\n  return m;\n}\n\nfunction loopPoints(a, da, b, db) {\n  const mid = a.clone().add(b).multiplyScalar(0.5);\n  const out = mid.clone().normalize().multiplyScalar(0.35 + a.distanceTo(b) * 0.15);\n  return [a, a.clone().addScaledVector(da, 0.12), a.clone().addScaledVector(da, 0.3).lerp(mid, 0.25), mid.add(out), b.clone().addScaledVector(db, -0.3).lerp(mid, 0.25), b.clone().addScaledVector(db, -0.12), b];\n}\n\nfunction buildHeme(name) {\n  const g = new THREE.Group(); g.name = name;\n  const add = (geo, mat, n, pos, rot) => {\n    const m = new THREE.Mesh(geo, mat); m.name = `${name}_${n}`;\n    if (pos) m.position.copy(pos); if (rot) m.rotation.set(...rot);\n    m.castShadow = true; g.add(m); return m;\n  };\n  const r = 0.032;\n  add(new THREE.TorusGeometry(0.022, 0.0035, 10, 48), M.heme, 'macrocycle');\n  for (let i = 0; i < 4; i++) {\n    const a = i * Math.PI / 2;\n    add(new THREE.TorusGeometry(0.0105, 0.0032, 10, 5), M.heme, `pyrrole_${i + 1}`, V(Math.cos(a) * r, Math.sin(a) * r, 0), [0, 0, a + Math.PI]);\n    const b = a + Math.PI / 4;\n    add(new THREE.SphereGeometry(0.0042, 16, 12), M.heme, `methine_${i + 1}`, V(Math.cos(b) * 0.036, Math.sin(b) * 0.036, 0));\n    // side-chain stubs (methyl / vinyl)\n    for (const s of [-1, 1]) {\n      const c = a + s * 0.42, p = V(Math.cos(c) * 0.05, Math.sin(c) * 0.05, 0);\n      const m = add(new THREE.CylinderGeometry(0.0025, 0.0025, 0.014, 8), M.heme, `sidechain_${i + 1}_${s > 0 ? 'b' : 'a'}`, p);\n      m.rotation.z = c - Math.PI / 2;\n    }\n  }\n  // propionates toward solvent (+x)\n  for (const s of [-1, 1]) {\n    const pts = [V(0.055, s * 0.018, 0), V(0.072, s * 0.03, 0.006), V(0.088, s * 0.028, 0.016), V(0.098, s * 0.04, 0.026)];\n    const m = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 16, 0.0028, 8), M.heme);\n    m.name = `${name}_propionate_${s > 0 ? 'a' : 'b'}`; m.castShadow = true; g.add(m);\n  }\n  add(new THREE.SphereGeometry(0.009, 32, 20), M.iron, 'Fe');\n  // dioxygen loosely coordinated on distal side (+z), bent end-on (~120°)\n  const o2 = new THREE.Group(); o2.name = `${name}_O2`; g.add(o2);\n  const o1p = V(0, 0, 0.030), o2p = V(0.014, 0, 0.038);\n  for (const [n, p] of [['O1', o1p], ['O2', o2p]]) {\n    const m = new THREE.Mesh(new THREE.SphereGeometry(0.0085, 24, 16), M.oxygen);\n    m.name = `${name}_O2_${n}`; m.position.copy(p); m.castShadow = true; o2.add(m);\n  }\n  const bondDir = o2p.clone().sub(o1p), bl = bondDir.length();\n  for (const s of [-1, 1]) {\n    const b = new THREE.Mesh(new THREE.CylinderGeometry(0.0018, 0.0018, bl, 8), M.oxygen);\n    b.name = `${name}_O2_double_bond_${s > 0 ? 'a' : 'b'}`;\n    b.quaternion.setFromUnitVectors(V(0, 1, 0), bondDir.clone().normalize());\n    b.position.copy(o1p).add(o2p).multiplyScalar(0.5).add(V(0, s * 0.0028, 0));\n    o2.add(b);\n  }\n  // dashed Fe···O coordination\n  for (let i = 0; i < 3; i++) {\n    const z = 0.01525 + (i - 1) * 0.0040;\n    const d = new THREE.Mesh(new THREE.SphereGeometry(0.0016, 10, 8), M.iron);\n    d.name = `${name}_Fe_O2_coord_${i + 1}`; d.position.set(0, 0, z); o2.add(d);\n  }\n  return g;\n}\n\nfunction buildSubunit(kind, label) {\n  const g = new THREE.Group(); g.name = label;\n  const mat = M[kind];\n  const hs = HELICES.filter(h => kind === 'beta' || !h.betaOnly).map(h => ({ h, ...helixPoints(h) }));\n  const rg = RANGES[kind], seqLen = SEQ[kind].length;\n  hs.forEach(({ h, pts }) => g.add(tube(pts, 0.0065, h.n * 16, mat, `${label}_helix_${h.id}`, false, resRange(kind, ...rg[h.id]))));\n  for (let i = 0; i < hs.length - 1; i++) {\n    const A = hs[i], B = hs[i + 1];\n    const a = rg[A.h.id][1] + 1, b = rg[B.h.id][0] - 1;\n    const res = b >= a ? resRange(kind, a, b) : resRange(kind, a - 1, b + 1);\n    const ta = A.pts.at(-1).clone().sub(A.pts.at(-2)).normalize(), tb = B.pts[1].clone().sub(B.pts[0]).normalize();\n    g.add(tube(loopPoints(A.pts.at(-1), ta, B.pts[0], tb), 0.0065, 96, mat, `${label}_loop_${A.h.id}${B.h.id}`, false, res));\n  }\n  const first = hs[0], last = hs.at(-1);\n  const n0 = first.pts[0];\n  const nTail = tube([n0.clone().add(V(-0.6, 0.5, 0.4)), n0.clone().add(V(-0.3, 0.1, 0.3)), n0.clone().addScaledVector(first.d, -0.12), n0], 0.0065, 64, mat, `${label}_N_terminus`, false, resRange(kind, 1, rg.A[0] - 1));\n  g.add(nTail);\n  const nEnd = new THREE.Mesh(new THREE.SphereGeometry(0.0095, 24, 16), M.nterm);\n  nEnd.name = `${label}_N_terminus_cap`; nEnd.castShadow = true;\n  nEnd.position.copy(n0).add(V(-0.6, 0.5, 0.4)).multiplyScalar(S);\n  g.add(nEnd);\n  g.userData.nterm = { c0: n0, d: first.d.clone().negate(), res: resRange(kind, 1, rg.A[0] - 1), tail: nTail, cap: nEnd, label, isN: true };\n  const c0 = last.pts.at(-1);\n  const cTail = tube([c0, c0.clone().addScaledVector(last.d, 0.2), c0.clone().add(V(0.5, -0.4, 0.3)), c0.clone().add(V(0.9, -0.3, 0.7))], 0.0065, 64, mat, `${label}_C_terminus`, false, resRange(kind, rg.H[1] + 1, seqLen));\n  g.add(cTail);\n  const cEnd = new THREE.Mesh(new THREE.SphereGeometry(0.0095, 24, 16), M.cterm);\n  cEnd.name = `${label}_C_terminus_cap`; cEnd.castShadow = true;\n  cEnd.position.copy(c0).add(V(0.9, -0.3, 0.7)).multiplyScalar(S);\n  g.add(cEnd);\n  g.userData.cterm = { c0, d: last.d.clone(), res: resRange(kind, rg.H[1] + 1, seqLen), tail: cTail, cap: cEnd, label, isN: false };\n\n  const heme = buildHeme(`${label}_heme`);\n  heme.position.copy(HEME_C).multiplyScalar(S);\n  heme.scale.setScalar(1.5);\n  g.add(heme);\n  // proximal histidine F8 -> Fe\n  const fHelix = hs.find(x => x.h.id === 'F');\n  let near = fHelix.pts[0];\n  for (const p of fHelix.pts) if (p.distanceTo(HEME_C) < near.distanceTo(HEME_C)) near = p;\n  const fe = HEME_C.clone().add(V(0, 0, -0.03));\n  g.add(tube([near, near.clone().lerp(fe, 0.5).add(V(0.05, 0, 0)), fe], 0.0045, 16, mat, `${label}_His_F8`, false, [SEQ[kind][rg.his - 1]]));\n  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.009, 0.0028, 8, 5), AA_MATS[AA_IDX[SEQ[kind][rg.his - 1]]]);\n  ring.name = `${label}_His_F8_imidazole`;\n  ring.position.copy(HEME_C).add(V(0, 0, -0.1)).multiplyScalar(S);\n  ring.rotation.y = Math.PI / 2;\n  g.add(ring);\n  return g;\n}\n\nconst model = new THREE.Group(); model.name = 'hemoglobin';\nconst place = [\n  ['alpha', 'alpha1', V(2.1, 1.25, 1.25)],\n  ['beta', 'beta1', V(2.1, -1.25, -1.25)],\n  ['alpha', 'alpha2', V(-2.1, 1.25, -1.25)],\n  ['beta', 'beta2', V(-2.1, -1.25, 1.25)],\n];\nfor (const [kind, label, pos] of place) {\n  const sub = buildSubunit(kind, label);\n  const dir = pos.clone().normalize();\n  sub.quaternion.setFromUnitVectors(V(1, 0, 0), dir);\n  sub.rotateX(kind === 'beta' ? Math.PI : 0);\n  sub.position.copy(pos).multiplyScalar(S);\n  model.add(sub);\n}\n\n// Re-route each terminal tail so its cap clears every other part of the protein\nmodel.updateMatrixWorld(true);\nconst CLEAR = 0.0285; // m: cap radius + 1.0 cap diameter gap, measured to surface vertices\nfor (const key of ['cterm', 'nterm']) for (const sub of model.children) {\n  const ct = sub.userData[key];\n  const inv = sub.matrixWorld.clone().invert();\n  const pts = [];\n  model.traverse(o => {\n    if (!o.isMesh || o === ct.tail || o === ct.cap) return;\n    const pos = o.geometry.attributes.position, mw = o.matrixWorld;\n    for (let i = 0; i < pos.count; i += 3) pts.push(V(pos.getX(i), pos.getY(i), pos.getZ(i)).applyMatrix4(mw).applyMatrix4(inv));\n  });\n  const clearance = p => { let m = Infinity; for (const q of pts) { const d = p.distanceToSquared(q); if (d < m) m = d; } return Math.sqrt(m); };\n  const c0s = ct.c0.clone().multiplyScalar(S);\n  const e0 = ct.cap.position.clone();\n  const L0 = e0.distanceTo(c0s);\n  let best = e0, bestScore = clearance(e0) >= CLEAR ? 0 : Infinity;\n  if (bestScore) {\n    for (let k = 0; k < 400; k++) {\n      const y = 1 - 2 * (k + 0.5) / 400, r = Math.sqrt(1 - y * y), th = k * 2.39996;\n      const dir = V(r * Math.cos(th), y, r * Math.sin(th));\n      for (const f of [1, 1.2, 1.4, 1.6]) {\n        const p = c0s.clone().addScaledVector(dir, L0 * f);\n        const score = p.distanceTo(e0);\n        if (score < bestScore && clearance(p) >= CLEAR) { best = p; bestScore = score; }\n      }\n    }\n  }\n  if (best !== e0) {\n    const E = best.clone().divideScalar(S), C = ct.c0;\n    const p1 = C.clone().addScaledVector(ct.d, 0.2);\n    const mid = p1.clone().lerp(E, 0.5);\n    const t = tube(ct.isN ? [E, mid, p1, C] : [C, p1, mid, E], 0.0065, 64, null, ct.label + (ct.isN ? '_N_terminus' : '_C_terminus'), false, ct.res);\n    sub.remove(ct.tail); ct.tail.geometry.dispose(); sub.add(t);\n    ct.cap.position.copy(best);\n  }\n}\n\nconst box = new THREE.Box3().setFromObject(model);\nconst ctr = box.getCenter(new THREE.Vector3());\nmodel.position.set(-ctr.x, -box.min.y, -ctr.z);\nconst root = new THREE.Group(); root.name = 'hemoglobin_root'; root.add(model);\nstage.setObject(root);\nroot.traverse(o => { if (o.isMesh) { o.castShadow = false; o.receiveShadow = false; } });\nif (stage._ground) stage._ground.visible = false;\nif (stage._toolbar) stage._toolbar.remove();\nstage.shadowRoot?.querySelector('.note')?.remove();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
